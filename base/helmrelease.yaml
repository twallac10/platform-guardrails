apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: guardrails
  namespace: guardrails
spec:
  interval: 10m
  releaseName: guardrails
  chartRef:
    kind: OCIRepository
    name: guardrails
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  test:
    enable: true
    ignoreFailures: false
